name: API Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v7

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v api_tests/